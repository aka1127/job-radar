# EXAMPLE PROFILE. Alex Moreau and every employer, school, link and number below are FICTIONAL: this profile shows
# the format, runs the demo and the tests. Copy the folder to candidates/<name>/ and replace everything, or run
# `python -m hunter onboard <name> --cv your-cv.pdf`.
#
# Master profile: the single source of truth for every tailored CV. The AI may only reword, reorder, select
# and translate what is here. It must never invent tools, numbers, employers, titles or dates.


# Links the candidate publishes. Used in letters and messages for the design families.
links:
  portfolio: "https://alexmoreau.example.com"
  case_studies: "https://alexmoreau.example.com/work"

positioning: >
  Product designer (UX/UI) with 8+ years of experience, from a web agency in Lille to a health-tech scale-up in
  Lyon: research, flows, prototypes, design systems and accessibility (WCAG 2.1 AA, RGAA), through to developer
  handoff. Priority target: healthcare (hospital groups, e-health, medtech, health insurers), where the patient
  portal and clinician app at Hexalab Santé count. Also strong for product design, UX research, design systems
  and accessibility roles. Bilingual FR/EN. AI level: everyday user of design and writing assistants; AI stays a
  supporting skill.

# Notes every letter, message and CV must follow for this candidate.
writing_notes:
  - Hexalab Santé (Feb 2024 - present) is always first. Health jobs (FRAMING health) get 4-6 bullets with the
    numbers (usability sessions, WCAG AA products, squads using the design system). Other jobs get 2-3 bullets.
  - Experience is "8+ years of experience" / "+8 ans d'expérience" (since Sep 2018). Use exactly that wording;
    never a bigger number, never years in a narrower specialty.
  - "Never call Alex an engineer or a developer: the Atelier Nord role was web integration (HTML, CSS, WordPress),
    which is why handoff with developers goes smoothly. Say so, no more."
  - Write "co-organiser of the Lyon UX Meetup", never founder; "maintainer of Clair UI", never "used by thousands".
  - The headline always starts from the posting's job title, never "Senior" unless the posting says so.
  - When a letter cites the Orbital Studio bank app, say "a retail bank" without naming one.
  - On research postings, Orbital Studio may use the alternative title "UX Researcher & Designer".

# Role families the candidate genuinely qualifies for. Used for search terms and CV headlines.
role_families:

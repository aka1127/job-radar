# Links the candidate publishes. Used in sport, content and creative applications (letter, messages).
links:
  courtside_site: "https://courtside.example.com"
  courtside_podcast: "https://courtside.example.com/podcast"

positioning: >
  Digital marketer and project manager with 5+ years of experience across 3 countries (France, Spain,
  Portugal), B2B and B2C, after 2 years in sales and customer service. Since January 2025 runs Courtside, an
  independent basketball media (podcast, video series, game coverage). Priority target: the sports industry
  (clubs, leagues, sports brands, sports media and events), where Courtside and the marketing background meet.
  Also strong for digital marketing, content and social media, project management, events, and partnerships or
  account management. Trilingual FR/EN/ES. AI level: everyday user; AI stays a supporting skill.

# Notes every letter, message and CV must follow for this candidate.
writing_notes:
  - Courtside (Jan 2025 - present) is always first in experience. Title it as an independent media, never as a
    company with employees and never as paid work. Sport jobs (FRAMING sport) get 4-6 bullets with the audience
    numbers. Other jobs get 2 bullets, reframed for the posting.
  - Write "guests including a club general manager" / "invités dont un directeur général de club". Never suggest
    the candidate worked for a club, a league or a brand they only interviewed.
  - The headline always starts from the posting's job title, never "Founder" / "Fondateur".
  - When a letter cites Velora Mobility, say once that it was a work-study placement alongside the MSc (in French
    "en alternance"; never the word alternance in English).
  - Experience is "5+ years of experience" / "+5 ans d'expérience". Use exactly that wording; never a bigger
    number, never years in a narrower specialty.
  - For Portside Logistics, on project management postings the alternative title "Project Manager, Digital
    Strategy" may replace "Digital Marketing Manager".
  - Partnership and account postings lead with the 2 years at Callwave (sales, upselling, client follow-up), then
    partner outreach at Portside Logistics and company partnerships at Atlantica Business School.


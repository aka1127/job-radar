    headline_fr: UX Researcher & Designer | Entretiens, tests utilisateurs, parcours
  design_system:
    headline_en: Design System Designer | Tokens, components, Storybook, documentation
    headline_fr: Designer Design System | Tokens, composants, Storybook, documentation
  accessibility:
    headline_en: Accessibility & Inclusive Design Specialist | WCAG 2.1, RGAA, audits
    headline_fr: Spécialiste accessibilité & design inclusif | WCAG 2.1, RGAA, audits


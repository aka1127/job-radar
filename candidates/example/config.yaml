# Example candidate (fictional): Alex Moreau, Lyon, product design with a priority on healthcare.
# Overrides ../../config.yaml. Copy this folder to candidates/<name>/ and adapt, or run
# `python -m hunter onboard <name> --cv your-cv.pdf` to have it written from a CV.

country: FR                # ISO code of the country to search in (DE, ES, GB, US, MA...)
home: "Lyon, Auvergne-Rhône-Alpes"   # a city GeoNames knows (15,000+ people); the radius is drawn around it
home_label: Lyon
home_radius_km: 40         # cities this close to Lyon are the home area: tier 1 with remote jobs, scored first
cv_languages: [en, fr]     # CVs and letters in English or French; postings in other languages get English

# Used by the scorer and the triage: what counts as a core target, and at which level.
level_note: >
  First priority: healthcare (hospital and clinic groups, e-health and medtech companies, health insurers, public
  health bodies): product, UX and UI design, UX research, design systems and accessibility on patient or clinician
  products. Score mid-to-senior health design roles generously when they fit the Hexalab Santé work. Other core
  targets, individual-contributor or senior level: product designer, UX/UI designer, UX researcher, design system
  designer, accessibility specialist. Lead or Head of design titles are stretch roles: score them 75+ only when the
  team is small and the scope matches, otherwise below 60. Graphic, motion, industrial or interior design, and
  marketing or developer roles are below 40.

# Tier 1: the home region or remote in France. Tier 2: elsewhere in France, lower priority and a higher bar.
locations:
  - {query: "Lyon, France", tier: 1}
  - {query: "France", tier: 2}
min_score: {1: 55, 2: 65}
contracts: [permanent, fixed_term, unknown]   # in France: CDI, CDD
dealbreakers: [internship or apprenticeship, a language the candidate lacks required at native level,
               far more years than the candidate has, a developer or engineering role, a job abroad]

# Job families the scorer sorts postings into; each one angles the CV its own way (framing_notes).
families:
  health: "the job's core is a health product or a health employer: patient, clinician or care-team products, e-health, medtech, hospital groups, health insurers"
  ux_research: "user research, usability testing, service design, discovery"
  design_system: "design systems, UI kits, design ops, front-end collaboration"
  accessibility: "accessibility, inclusive design, RGAA or WCAG audits and remediation"
  product_design: "any other product, UX or UI design role"
default_family: product_design

# The priority sector: its jobs get their own look in Telegram, go first, and health roles get a lower bar.
priority:
  family: health
  label: HEALTHCARE
  tag: HEALTH
  emoji: "🩺"
  icon: health             # star, heart, health, bolt, leaf, briefcase, flag, pin, shield, globe, trophy, music
  min_score: {1: 45, 2: 55}
  sector: >-
    the employer works in health (hospital or clinic group, e-health or medtech company, health insurer, pharma's
    digital arm, public health body), whatever the role
  note: >-
    Healthcare is the candidate's first priority. For priority_sector postings, count the Hexalab Santé work (patient
    portal, clinician app, 120+ usability sessions with patients and care teams, WCAG 2.1 AA) as direct proof, and
    do not mark the lack of a clinical background as a gap.

framing_notes:
  health: >-
    Health employer, the candidate's first priority. Hexalab Santé first with 4-6 bullets: the patient portal and
    clinician app, the usability sessions with patients and care teams, the WCAG 2.1 AA products, the design system
    used by 4 squads. One skills group for health product design (clinical workflows, accessibility, research with
    patients). The letter gives the portfolio link as a plain URL.
  ux_research: >-
    Research role. Hexalab Santé first with 3-4 bullets on the sessions and the research share-out; Orbital Studio
    may use alt_title (UX Researcher & Designer) with the interviews, tests and journey maps; Kerno Mobility: the 40
    commuter interviews and diary studies.
  design_system: >-
    Design system role. Lead with Pulse at Hexalab Santé (tokens, components, Storybook, Zeroheight, 4 squads), then
    the Figma component library at Kerno Mobility and the Storybook reviews at Orbital Studio. Clair UI in projects.
  accessibility: >-
    Accessibility role. Lead with the 3 WCAG 2.1 AA products at Hexalab Santé and the accessible public-sector
    service at Orbital Studio; the Opquast and RGAA training; the Atelier Nord templates. Plain CV: no tiles, no
    portfolio link.
  product_design: >-
    Product design role. Lead with 8+ years of product design; Hexalab Santé 3-4 bullets, Orbital Studio 3 bullets
    (bank app, checkout +18%, design sprints), Kerno Mobility 2 bullets, Atelier Nord 1 bullet.

# Extra writing rules for this field, added to the truth rules of every prompt.
writing_rules:
  - >-
    Design practices overlap: describe a real activity with the posting's vocabulary ("product design", "UX/UI
    design" or "conception d'interfaces" for the same work; "tests utilisateurs" = "usability testing"; "maquettes"
    = mockups; "parcours" = flows or journeys). Tools stay as the profile names them.
  - >-
    AI is a supporting skill: once in the whole CV at most when the posting does not ask for it, never a skills
    group named after AI.
neutral_title: {en: Product designer, fr: Designer produit}

# The quick title sort before scoring (triage).
triage:
  possible: >-
    a design, research, accessibility or product role with a vague or mixed title (Designer, Chef de projet UX,
    Product Owner UX, Consultant accessibilité), or a Lead, Senior or Head title in those fields (the full review
    weighs the level)
  skip: >-
    the work itself is graphic, motion, 3D, game, industrial, textile or interior design; front-end or software
    development; marketing, communication, sales, support or HR; internships, apprenticeships and graduate
    programmes; director, VP or C-level roles
brief_snapshot: "3 observations you actually verified about their product (app or site onboarding, accessibility, design maturity, design system)"

# CV parts that depend on the family: the creative tiles and the portfolio link in the header.
cv:
  creative_families: [health, product_design]
  portfolio_families: [health, product_design, ux_research, design_system]
  ai_supporting_skill: true   # AI is not this person's field: never a skills group of its own

# Every term runs on every board and location. The first 12 also steer the daily web search for career pages.
searches:
  - product designer santé
  - UX designer santé
  - product designer
  - UX designer
  - UX/UI designer
  - designer d'expérience utilisateur
  - UX researcher
  - design system designer
  - designer d'interface
  - accessibilité numérique
  - UX designer e-santé
  - designer produit
  - service designer
  - UI designer
  - senior product designer
  - lead product designer
  - design ops
  - consultant accessibilité
  - product design medtech
  - UX research santé

# Cheap filter on the job title before any AI call (case-insensitive regex).
title_must_match: 'design(?!er (graphique|textile|industriel|mobilier|m[ée]canique))|\bux\b|\bui\b|user experience|exp[ée]rience utilisateur|interaction|design system|accessibilit|\brgaa\b|\bwcag\b|ergonom|service design|user research|recherche utilisateur|prototyp|figma|design ?ops|interface'
title_must_not_match: 'stage|stagiaire|\binterns?\b|internship|alternan|apprenti|working student|freelance|int[eé]rim|portage|director|directeur|directrice|\bvp\b|vice.president|chief|\bcdo\b|head of|graphiste|graphic|motion|\b3d\b|game|jeu vid[ée]o|industrial|industriel|m[ée]canique|textile|\bmode\b|fashion|int[ée]rieur|interior|architect|\bcad\b|\bdao\b|developer|d[ée]veloppeur|engineer|ing[ée]nieur|front.?end|product manager|product owner|chef de produit|marketing|communication|commercial|\bsales\b|support|recrut|\brh\b|\bdata\b|analyst|\bqa\b|test(eur|er)s?\b|sound|audio|lumi[èe]re|\bcao\b|paysag|landscape|floral|culinaire|jardin'

# Engine defaults for every candidate. candidates/<name>/config.yaml overrides any key (and holds everything about
# the person: country, home, targets, searches, filters). docs/configuration.md lists every key.

# The look and the words of the product, in one place (defaults in hunter/brand.py). Change them here to rebrand.
brand:
  name: Job Radar
  accent: "#2453c9"        # CV and letter accent when the target company gives no color
  accent_ink: "#1b3e99"    # darker accent: employer names, dates, Word headings
  soft: "#f2f5fb"          # tinted backgrounds: header band, tiles
  badge: "#1e3a8a"         # monogram badges for employers and schools without a logo
  font: Inter              # family name of the woff2 files in assets/fonts (drop other files there to change it)
  priority:                # the Telegram header of a job in the priority sector, whatever the company's colors
    gradient: ["#14061f", "#4a0f5c", "#b0125f"]
    tag: "#f5c542"
    tag_ink: "#2a0c33"
# texts: every sentence the person reads in Telegram, by key (the keys and English defaults are in hunter/brand.py).
# Uncomment and translate or reword the ones you want, keeping the {placeholders}:
# texts:
#   btn_applied: "✅ J'ai postulé"
#   help: "Bonjour ! Je surveille les offres et t'envoie un CV adapté pour chaque bonne annonce..."

# How the crawler introduces itself to the sites it reads (robots.txt is checked before any page is opened).
crawl:
  user_agent: "Mozilla/5.0 (compatible; JobRadar/1.0; +https://github.com/aka1127/job-radar)"

# AI runs through the Claude Code CLI on your own Claude account (no API key).
claude:
  models: {onboard: opus, triage: sonnet, score: opus, pack: opus, screen: opus, revise: opus, brief: opus, discover: opus, extract: opus}
  effort: {onboard: high, triage: low, score: low, pack: high, screen: low, revise: high, brief: medium, discover: medium, extract: low}
  triage_batch: 80     # postings sorted by title per triage call, before the full scoring (one call each)
  timeout_s: 900
  parallel: 3          # scoring calls at the same time
  daily_call_warning: 400   # one Telegram heads-up per day above this many Claude calls

sources:
  # Job board searches (through JobSpy). Off by default: LinkedIn, Indeed, Glassdoor and HelloWork forbid
  # scraping in their terms and robots.txt. A candidate's config can turn one on, at the operator's own risk; their
  # job alert emails (ALERTS_SETUP.md) bring the same jobs the respectful way. HelloWork exists in France only;
  # Indeed and Glassdoor need a country JobSpy supports.
  linkedin: false
  indeed: false
  hellowork: false
  glassdoor: false
  france_travail: true     # France only: the official API, needs FRANCE_TRAVAIL_CLIENT_ID / _SECRET in .env
  email_alerts: true       # job alert emails read from a mailbox (ALERTS_IMAP_USER / ALERTS_IMAP_PASSWORD in .env)
  career_pages: true       # company career boards: Lever, Greenhouse, Ashby, Workable, SmartRecruiters, Workday,
                           # Teamtailor, Recruitee, Personio and any page with schema.org JobPosting data

scraping:
  results_per_search: 25
  first_run_hours: 72      # look-back on the very first run
  min_window_hours: 2      # later runs look back to the previous run, at least this much
  pause_between_searches_s: [4, 9]
  pause_between_details_s: [2, 5]
  max_details_per_run: 80  # job pages opened per run; the rest wait for the next run
  board_every_hours: {linkedin: 3}  # LinkedIn blocks frequent visitors; each run still looks back
                                   # to its last good one, so no job is missed

career_pages:
  poll_every_hours: 3
  max_minutes_per_run: 15  # for all platforms together; boards not reached are polled first next run
  max_new_companies_per_run: 15  # companies probed by name per run (about 20 small requests each)
  discover_every_hours: 24  # Claude searches the web for career pages once a day
  max_age_days: 45          # ignore postings older than this

home_radius_km: 40         # cities this close to the candidate's home count as their home area (tier 1)
send_hours: [8, 24]        # packs reach the candidate from 8:00 to midnight only; jobs found at night wait
max_scores_per_run: 250    # Claude scores per run (core targets, home area and freshest first)
max_scores_per_day: 600    # and per day, to keep the Claude subscription for the packs that matter
max_packs_per_run: 10
max_packs_per_day: 30      # the best matches of the day, priority sector first; lower it to what you can act on
queue_days: 5              # good matches over the cap wait this long, best first
pending_days: 7            # postings still unscored after this long (daily scoring cap) expire
company_brief: true        # web research per company, used in outreach and interview prep
brand_colors: true         # tint the designed CV and letter with the target company's brand color
followup_after_days: 7     # follow up one week after applying

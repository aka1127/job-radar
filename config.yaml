# Defaults for every candidate. candidates/<name>/config.yaml overrides any key.

# AI runs through the Claude Code CLI on your own Claude account (no API key).
claude:
  models: {onboard: opus, triage: sonnet, score: opus, pack: opus, screen: opus, revise: opus, brief: opus, discover: opus, extract: opus}
  effort: {onboard: high, triage: low, score: low, pack: high, screen: low, revise: high, brief: medium, discover: medium, extract: low}
  triage_batch: 80     # postings sorted by title per triage call, before the full scoring (one call each)
  timeout_s: 900
  parallel: 3          # scoring calls at the same time
  daily_call_warning: 400   # one Telegram heads-up per day above this many Claude calls

sources:
  # Job board searches (through JobSpy). Off by default: LinkedIn, Indeed, Glassdoor and HelloWork forbid
  # scraping in their terms and robots.txt (docs/job-boards-france.md). A candidate's config can turn one on, at
  # the operator's own risk; their job alert emails (ALERTS_SETUP.md) bring the same jobs the respectful way.
  linkedin: false
  indeed: false
  hellowork: false
  glassdoor: false         # Glassdoor France, descriptions included
  france_travail: true     # needs FRANCE_TRAVAIL_CLIENT_ID / _SECRET in .env, skipped otherwise
  email_alerts: true       # job alert emails (Welcome to the Jungle, APEC, LinkedIn...) read from a mailbox;
                           # needs ALERTS_IMAP_USER / ALERTS_IMAP_PASSWORD in .env, skipped otherwise
  career_pages: true       # company career sites: Lever, Greenhouse, Ashby, Workable, SmartRecruiters,
                           # Teamtailor, Recruitee, Personio and any page with schema.org JobPosting data

scraping:
  results_per_search: 25
  first_run_hours: 72      # look-back on the very first run
  min_window_hours: 2      # later runs look back to the previous run, at least this much
  pause_between_searches_s: [4, 9]
  pause_between_details_s: [2, 5]
  max_details_per_run: 80  # job pages opened per run; the rest wait for the next run
  board_every_hours: {linkedin: 3}  # LinkedIn blocks frequent visitors; each run still looks back
                                   # to its last good one, so no job is missed

career_pages:
  poll_every_hours: 3
  max_minutes_per_run: 15  # per platform; boards not reached are polled first next run
  max_new_companies_per_run: 15  # companies probed by name per run (about 20 small requests each)
  discover_every_hours: 24  # Claude searches the web for career pages once a day
  max_age_days: 45          # ignore postings older than this

send_hours: [8, 24]        # packs reach the candidate from 8:00 to midnight only; jobs found at night wait
max_scores_per_run: 250    # Claude scores per run (Paris region and freshest first); a big catch-up spreads out
max_scores_per_day: 600    # and per day, to keep the Claude subscription for the packs that matter
max_packs_per_run: 10
max_packs_per_day: 30      # the best matches of the day, music first; lower it if it is too many to act on
queue_days: 5              # good matches over the cap wait this long, best first
pending_days: 7            # postings still unscored after this long (daily scoring cap) expire
company_brief: true         # web research per company, used in outreach and interview prep
brand_colors: true          # tint the designed CV and letter with the target company's brand color
followup_after_days: 7     # French norm: follow up one week after applying
